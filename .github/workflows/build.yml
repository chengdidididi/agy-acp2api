name: Build CPA Plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: agy-acp2api
  DEFAULT_TAG: v0.1.4

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
        working-directory: cpa-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-plugin/go.mod
          cache: true
          cache-dependency-path: cpa-plugin/go.mod

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${DEFAULT_TAG}"
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          go mod tidy
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${LIB_NAME}" ./cmd/agy-acp2api
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            cpa-plugin/${{ env.ARCHIVE_NAME }}
            cpa-plugin/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-plugin/go.mod
          cache: true
          cache-dependency-path: cpa-plugin/go.mod

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release & Direct Raw Assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${DEFAULT_TAG}"
          fi
          VERSION="${RELEASE_TAG#v}"
          sort dist/*.sha256 > dist/checksums.txt

          # 1. Copy built zip files into cpa-plugin/releases/ and generate schema_version 2 registry.json
          mkdir -p cpa-plugin/releases
          rm -f cpa-plugin/releases/*.zip
          cp dist/*.zip dist/checksums.txt cpa-plugin/releases/

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/cpa-plugin/releases"
          (
            cd cpa-plugin
            go run ./scripts/generate-registry.go \
              -dist ../dist \
              -version "${VERSION}" \
              -base-url "${RAW_BASE}" \
              -out ../registry.json
          )
          cp registry.json cpa-plugin/registry.json

          # 2. Commit & push pre-built releases and registry.json to main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpa-plugin/releases/ registry.json cpa-plugin/registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish direct plugin assets and registry.json for ${RELEASE_TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

          # 3. Also update GitHub Release
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Automated CLIProxyAPI plugin release for ${RELEASE_TAG}."
          fi
